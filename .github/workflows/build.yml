name: Build & Package Extension

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run compile

      - name: Build extension
        run: npm run build

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: gmsh-preview-vsix
          path: "*.vsix"

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gmsh-preview-*.vsix
          generate_release_notes: true

      - name: Publish to Open VSX (if OPEN_VSX_TOKEN is configured)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          if [ -n "$OPEN_VSX_TOKEN" ]; then
            npx -y ovsx publish gmsh-preview-*.vsix -p "$OPEN_VSX_TOKEN"
          else
            echo "OPEN_VSX_TOKEN not set, skipping Open VSX publish."
          fi

      - name: Publish to VS Code Marketplace (if VSCE_PAT is configured)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx -y @vscode/vsce publish --packagePath gmsh-preview-*.vsix -p "$VSCE_PAT"
          else
            echo "VSCE_PAT not set, skipping VS Code Marketplace publish."
          fi
